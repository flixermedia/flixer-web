name: Build and publish Android TV AAB

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track to publish to
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      publish_to_play:
        description: Publish to Google Play (enable after first manual AAB upload)
        type: boolean
        default: false

jobs:
  android-tv-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Resolve Android version
        id: version
        shell: bash
        run: |
          version_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          version_code="$((100 + GITHUB_RUN_NUMBER))"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/upload-keystore.jks"

      - name: Build signed Android TV App Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew :tv:bundleRelease

      - name: Upload TV AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixer-tv-android-aab-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android/tv/build/outputs/bundle/release/tv-release.aab

      - name: Publish to Google Play
        if: inputs.publish_to_play && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.flixermedia.flixer.tv
          releaseFiles: android/tv/build/outputs/bundle/release/tv-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
