name: Check translations

on:
  pull_request:
    paths:
      - 'src/locales/**'
      - 'scripts/check-locales.mjs'
  push:
    branches:
      - main
    paths:
      - 'src/locales/**'

jobs:
  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-locales.mjs
