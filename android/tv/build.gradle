apply plugin: 'com.android.application'

android {
    namespace = "com.flixermedia.flixer"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.flixermedia.flixer.tv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def resolvedVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "12").toInteger()
        def resolvedVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.12.0"
        versionCode resolvedVersionCode
        versionName resolvedVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../app/proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['src/main/res', '../app/src/main/res']
            assets.srcDirs = ['../app/src/main/assets']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', '../app/libs'
    }
}

dependencies {
    implementation fileTree(dir: '../app/libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: '../app/capacitor.build.gradle'