<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Sign in to Flixer to continue your personal streaming experience." />
    <meta name="theme-color" content="#080811" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background-color: #080811;
      }
      html.light,
      html.light body {
        background-color: #f5f4fa;
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a dark flash.
      try {
        var t = localStorage.getItem('flixer.theme')
        if (t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
    <title>Sign in to Flixer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
