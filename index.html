<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Sign in to Flixer to continue your personal streaming experience." />
    <meta name="theme-color" content="#0b1118" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background-color: #080811;
      }
      html.light,
      html.light body {
        background-color: #f5f4fa;
      }
      .startup {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 1.5rem;
        background: #080811;
        color: #fff;
        font: 16px system-ui, sans-serif;
        text-align: center;
      }
      html.light .startup {
        background: #f5f4fa;
        color: #171722;
      }
      .startup img {
        width: 3.5rem;
        height: 3.5rem;
      }
      .startup-logo {
        position: relative;
        display: grid;
        place-items: center;
        width: 7rem;
        height: 7rem;
        margin-bottom: 2.5rem;
      }
      .startup-spinner {
        position: absolute;
        inset: 0;
        border: 2px solid #a789ff45;
        border-top-color: var(--color-flixer-accent, #a789ff);
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      .startup-heading {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .startup p {
        max-width: 20rem;
        margin: 0;
        color: var(--color-flixer-muted, #aaa8ba);
        font-size: 0.875rem;
        line-height: 1.5;
      }
      html.light .startup p { color: #5f5d72; }
      .startup button {
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        border: 1px solid currentColor;
        border-radius: 0.4rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation: none; }
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a dark flash.
      try {
        var t = localStorage.getItem('flixer.theme')
        if (t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
    <title>Sign in to Flixer</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="startup" class="startup" role="status" aria-live="polite">
      <div class="startup-logo" aria-hidden="true">
        <img src="/favicon.svg" alt="" />
        <div class="startup-spinner"></div>
      </div>
      <h1 id="startup-heading" class="startup-heading">Loading Flixer</h1>
      <p id="startup-message">Getting everything ready for you…</p>
      <button id="startup-retry" type="button" hidden>Reload</button>
      <noscript>JavaScript is required to run Flixer.</noscript>
    </div>
    <script>
      document.getElementById('startup-retry').addEventListener('click', function () { location.reload() })
      var startupTimedOut = false
      function updateWaitingMessage() {
        var startup = document.getElementById('startup')
        if (!startupTimedOut || !startup || startup.dataset.failed === 'true') return
        document.getElementById('startup-message').textContent = navigator.onLine
          ? 'Flixer is taking too long to start. We’ll keep waiting, or you can try again.'
          : 'You appear to be offline. We’ll keep waiting for your connection to return.'
      }
      setTimeout(function () {
        if (!document.getElementById('startup') || !document.getElementById('startup-retry').hidden) return
        document.getElementById('startup-heading').textContent = 'Taking a little longer'
        document.getElementById('startup-message').textContent = 'Still getting things ready. Thanks for your patience.'
      }, 10000)
      setTimeout(function () {
        if (!document.getElementById('startup') || !document.getElementById('startup-retry').hidden) return
        startupTimedOut = true
        document.getElementById('startup-heading').textContent = 'Still waiting for Flixer'
        updateWaitingMessage()
        document.getElementById('startup-retry').hidden = false
      }, 30000)
      window.addEventListener('offline', updateWaitingMessage)
      window.addEventListener('online', updateWaitingMessage)
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
